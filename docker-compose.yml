
services:
  # ==========================================
  # Infrastructure Services
  # ==========================================

  # Eureka Service Registry
  eureka-server:
    build:
      context: ./services/required-services/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Database (used by order-service and product-details-service)
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: micro_services_order_db
    ports:
      - "3306:3306"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-net

  # Kafka (Message Broker for Notification Service)
  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices-net

  # ==========================================
  # Microservices
  # ==========================================

  # Product Details Service
  product-details-service:
    build:
      context: ./services/core-services/product-details-service
    #container_name: product-details-service
    ports:
      - "808:808"
    environment:
      - EUREKA_SERVER_URL=eureka-server
      - DB_HOST=mysql-db
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    networks:
      - microservices-net
    deploy:
      mode: replicated
      replicas: 1 # Scale this via: docker-compose up --scale product-details-service=3

  # User Service
  user-service:
    build:
      context: ./services/core-services/user-service
    #container_name: user-service
    ports:
      - "801:801"
    environment:
      - EUREKA_SERVER_URL=eureka-server
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    deploy:
      mode: replicated
      replicas: 1 # Scale this via: docker-compose up --scale user-service=3

  # Order Service
  order-service:
    build:
      context: ./services/core-services/order-service
    #container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_SERVER_URL=eureka-server
      - DB_HOST=mysql-db
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    networks:
      - microservices-net
    deploy:
      mode: replicated
      replicas: 1 # Scale this via: docker-compose up --scale order-service=3
    restart: always

  # Notification Service (Kafka Consumer/Producer)
  notification-service:
    build:
      context: ./services/core-services/notification-service
    #container_name: notification-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - microservices-net
    deploy:
      mode: replicated
      replicas: 1 # Scale this via: docker-compose up --scale notification-service=3

networks:
  microservices-net:
    driver: bridge
