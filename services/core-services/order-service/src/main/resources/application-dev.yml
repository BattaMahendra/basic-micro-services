management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
  health:
    circuitbreakers:
      enabled: true

#resilience-4j props

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        register-health-indicator: true
      product-details-service:
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        register-health-indicator: true

  timelimiter:
    instances:
      product-details-service:
        timeoutDuration: 2s
      user-service:
        timeoutDuration: 2s

  retry:
    instances:
      product-details-service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: false
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: false
        randomizedWaitFactor: 0.5
        retryExceptions:
            - java.io.IOException
            - java.net.ConnectException
            - java.lang.RuntimeException
        ignoreExceptions:
            - com.mahi.order.exception.OrderServiceException
        failAfterMaxAttempts: true
        eventConsumerBufferSize: 100
      user-service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: false
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: false
        randomizedWaitFactor: 0.5
        retryExceptions:
            - java.io.IOException
            - java.net.ConnectException
            - java.lang.RuntimeException
        ignoreExceptions:
            - com.mahi.order.exception.OrderServiceException
        failAfterMaxAttempts: true
        eventConsumerBufferSize: 100

  ratelimiter:
    instances:
      createOrderRateLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0ms

logging:
  level:
    # Set the logging level for your specific Feign client interface
    com.mahi.order.Feign.ProductFeign: DEBUG
    com.mahi.order.Feign.UserServiceFeign: DEBUG
