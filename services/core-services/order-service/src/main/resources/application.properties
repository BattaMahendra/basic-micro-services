spring.application.name=order-service
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/micro_services_order_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
server.port=8083

spring.datasource.hikari.initializationFailTimeout=60000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=5000

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://${EUREKA_SERVER_URL:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

# Feign Configuration
feign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic

user.base-uri: http://user-service/users/

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.product-details-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.product-details-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.product-details-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.product-details-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.product-details-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.product-details-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.product-details-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.product-details-service.slidingWindowType=COUNT_BASED

resilience4j.retry.instances.product-details-service.maxAttempts=3
resilience4j.retry.instances.product-details-service.waitDuration=500ms

resilience4j.circuitbreaker.instances.user-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.user-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.user-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.user-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.user-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.user-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.user-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.user-service.slidingWindowType=COUNT_BASED

resilience4j.retry.instances.user-service.maxAttempts=3
resilience4j.retry.instances.user-service.waitDuration=500ms

# Rate Limiter Configuration
resilience4j.ratelimiter.instances.createOrderRateLimiter.limitForPeriod=5
resilience4j.ratelimiter.instances.createOrderRateLimiter.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.createOrderRateLimiter.timeoutDuration=0ms
